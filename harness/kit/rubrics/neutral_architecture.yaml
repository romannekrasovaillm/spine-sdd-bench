# Нейтральная рубрика v2 (PREREGISTRATION-v2, раздел «Метрики»).
# Написана НЕ автором Spine и не по таксономии Spine: понятия ISO/IEC/IEEE 42010
# (архитектурные драйверы, представления, обоснование), arc42 и ADR в формате Nygard.
# Шкала 1–5, якоря 1/3/5. Сумма весов: 27.
name: neutral_architecture
description: "Нейтральная оценка архитектурного пакета: драйверы, варианты, обоснование, последствия, влияние на существующие решения, совместимость интерфейсов, измеримость требований, приёмка и откат, открытые вопросы"
scale_max: 5
origin: anchor
criteria:
  - id: drivers
    name: Проблема и архитектурные драйверы
    description: "Проблема сформулирована, и названы силы, которые определяют решение: функциональные требования, атрибуты качества, ограничения (регуляторные, организационные, технологические), допущения"
    weight: 3
    anchors:
      1: "Проблема названа одной фразой; драйверы не отделены от решения и не перечислены"
      3: "Проблема описана, часть драйверов названа, но они смешаны с решением и не приоритизированы"
      5: "Драйверы перечислены явно и отделены от решения; у каждого указан источник (требование, стандарт, ограничение) и приоритет"
  - id: options
    name: Варианты и критерии сравнения
    description: "Рассмотрено несколько вариантов (включая статус-кво), и названы критерии, по которым они сравниваются"
    weight: 3
    anchors:
      1: "Рассмотрен один вариант; критериев сравнения нет"
      3: "Варианты перечислены, но критерии сравнения не заявлены или применены неравномерно; статус-кво не рассмотрен"
      5: "Не менее двух осмысленных вариантов плюс статус-кво, сравнение по явным критериям, вытекающим из драйверов; для каждого варианта названа причина отказа"
  - id: rationale
    name: Обоснование выбора
    description: "Выбор прослеживается от драйверов через критерии к решению; понятно, почему выбранный вариант удовлетворяет драйверам лучше остальных"
    weight: 3
    anchors:
      1: "Выбор не обоснован: «приняли такой вариант»"
      3: "Обоснование есть, но ссылается на общие соображения, а не на названные драйверы и критерии"
      5: "Каждый ключевой драйвер прослеживается до решения; указано, при каких изменениях условий выбор был бы другим"
  - id: consequences
    name: Последствия с обеих сторон
    description: "Описаны и положительные, и отрицательные последствия решения: что улучшается, что ухудшается, для кого, с какой ценой"
    weight: 3
    anchors:
      1: "Последствия не описаны или описаны только положительные"
      3: "Отрицательные последствия названы абстрактно, без адресата и цены"
      5: "Последствия конкретны и адресны в обе стороны, с указанием цены и, где возможно, способа смягчения"
  - id: impact_on_existing
    name: Влияние на существующие решения
    description: "Явно указано, какие принятые решения затрагиваются, а какие нет; затронутые решения названы поимённо"
    weight: 3
    anchors:
      1: "Влияние на существующие решения не упомянуто"
      3: "Сказано, что решение затрагивает существующую архитектуру, но без перечня: какие именно решения затронуты и какие нет"
      5: "Есть явный перечень: какие принятые решения изменяются (с причиной) и какие сознательно не затрагиваются"
  - id: interface_compatibility
    name: Обратная совместимость интерфейсов
    description: "Показано, как изменение контрактов влияет на существующих потребителей: что остаётся совместимым, что ломается, как версионируется"
    weight: 3
    anchors:
      1: "Контракты не рассматриваются или изменения не связаны с потребителями"
      3: "Изменения контракта перечислены, но совместимость объявлена без анализа потребителей и версионирования"
      5: "Для каждого изменённого интерфейса указано, что сохраняется и что ломается, как поднимается версия и что делают существующие потребители"
  - id: measurable_quality
    name: Измеримые требования к качеству
    description: "Атрибуты качества заданы измеримо: числа, единицы, условия измерения, а не прилагательные"
    weight: 3
    anchors:
      1: "Требования к качеству отсутствуют или сформулированы качественно («быстро», «надёжно»)"
      3: "Часть требований измерима, часть — нет; условия измерения не указаны"
      5: "Каждое требование к качеству имеет число, единицу и условия измерения; указано, как оно проверяется"
  - id: verification_rollback
    name: Проверка, приёмка и откат
    description: "Определено, как решение проверяется, по каким критериям принимается и как откатывается"
    weight: 3
    anchors:
      1: "Критериев приёмки и плана отката нет"
      3: "Критерии приёмки или план отката есть, но один из двух отсутствует либо сформулирован неконкретно"
      5: "Есть проверяемые критерии приёмки и исполнимый план отката с условием срабатывания и ответственным"
  - id: open_questions
    name: Открытые вопросы и решение человека
    description: "Нерешённое вынесено явно: какой вопрос, кому решать, что блокирует и почему это не решено сейчас"
    weight: 3
    anchors:
      1: "Открытые вопросы не названы; пакет выглядит завершённым при наличии нерешённого"
      3: "Открытые вопросы перечислены, но без адресата и последствий, либо смешаны с решённым"
      5: "Каждый открытый вопрос имеет адресата (роль), причину нерешённости и указание, что он блокирует"
