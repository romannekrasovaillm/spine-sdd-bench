# Рубрика качества handoff-пакета изменения «подписки СБП» кодовому агенту
# (BMAD epic-context + headless-контракт): пакет должен позволить реализацию без доступа к исходным документам.
name: handoff_quality_subscriptions
description: "Качество handoff-пакета подписок СБП — epic-context, инварианты, критерии приёмки (в т.ч. негативные), headless-контракт результата, план отката"
scale_max: 5
origin: anchor
criteria:
  - id: epic_context
    name: Полнота epic-context
    description: "Дистиллят 800–1500 токенов: цель, стыки (API ТСП, адаптер ОПКЦ, АБС, нотификатор), запреты; без дословных выдержек и воды"
    weight: 3
    anchors:
      1: "Контекст — свалка выдержек или приписка «сделай по ADR-008»; реализация потребует догадок"
      3: "Смысловое ядро есть и уложено в бюджет, но стыки/ограничения покрыты частично"
      5: "800–1500 токенов чистого смысла: цель, контракты стыков, запреты; агент реализует без источников и архитектурных изобретений"
  - id: invariants
    name: Инварианты и запреты
    description: "Связывающие AD (AD-001…AD-011) переданы дословно (Rule), явно перечислено, что менять запрещено"
    weight: 3
    anchors:
      1: "Инварианты не переданы; исполнитель волен переизобрести контракты"
      3: "Инварианты перечислены, но пересказаны или без запретов на вне-scope изменения"
      5: "Все связывающие AD с дословными Rule; явный список запрещённого к изменению; конфликт со spine обязан останавливать работу"
  - id: acceptance_criteria
    name: Критерии приёмки
    description: "Проверяемые критерии, включая негативные сценарии (двойное списание, списание сверх лимита/после отзыва, зачисление без PAID, отказ соседа) и критерий отката"
    weight: 3
    anchors:
      1: "Критерии отсутствуют или непроверяемы"
      3: "Критерии измеримы, но только позитивные; негативные и откат не покрыты"
      5: "Каждый критерий проверяем тестом/командой; негативные сценарии перечислены; есть критерий успешного отката"
  - id: result_contract
    name: Контракт результата (headless JSON)
    description: "Требование завершить прогон JSON-статусом complete/partial/blocked с assumptions/open_questions/conflicts_with_prior_decisions"
    weight: 2
    anchors:
      1: "Формат результата не задан"
      3: "JSON-статус требуется, но поля не объяснены или не обязательны"
      5: "Контракт полный: статус + три списка; conflicts обязан останавливать и эскалировать; при blocked перечислены недостающие входы"
  - id: rollback_plan
    name: План отката
    description: "Как откатывается изменение (kill-switch, отзыв мандатов, rolling-откат), сигналы-триггеры, владелец решения"
    weight: 2
    anchors:
      1: "Плана отката нет"
      3: "Откат упомянут одной фразой; сигналы и владелец не названы"
      5: "Пошаговый откат с сигналами-триггерами и владельцем решения; обратимость согласована с ADR-008"
