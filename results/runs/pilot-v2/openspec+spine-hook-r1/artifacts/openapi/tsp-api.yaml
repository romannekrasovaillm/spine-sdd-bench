openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      summary: Заявка на создание мандата — согласия плательщика на рекуррентные списания
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Мандат создан в состоянии PENDING
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '409':
          description: Конфликт ключа идемпотентности
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Некорректные реквизиты или лимиты мандата
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Состояние мандата (проекция состояния, подтверждённого ОПКЦ)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '404':
          description: Мандат не найден
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/cancel:
    post:
      operationId: cancelMandate
      summary: Прекращение мандата по инициативе ТСП (объём операции — по протоколу СБП)
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '202':
          description: Прекращение мандата принято
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '409':
          description: Мандат уже прекращён
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/charges:
    post:
      operationId: createMandateCharge
      summary: Списание по мандату без участия плательщика в момент платежа
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChargeRequest'}
      responses:
        '201':
          description: Списание зарегистрировано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Charge'}
        '409':
          description: Списание за этот период уже существует (тот же invoiceId)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Мандат не активен, состояние неизвестно или превышены лимиты
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        initiationType:
          type: string
          enum: [QR, MANDATE]
          description: Тип инициации платежа; для платежей по QR/ссылке — QR (значение по умолчанию)
        mandateId:
          type: string
          nullable: true
          description: Мандат, по которому инициировано списание (только для initiationType=MANDATE)
        invoiceId:
          type: string
          nullable: true
          description: Идентификатор периода/счёта подписки у ТСП (ключ однократности вместе с mandateId)
    MandateRequest:
      type: object
      required: [tspId, amountLimit, periodLimit, maxChargesPerPeriod, period]
      properties:
        tspId: {type: string}
        amountLimit: {type: integer, description: Максимальная сумма одного списания, копейки}
        periodLimit: {type: integer, description: Максимальная сумма списаний за период, копейки}
        maxChargesPerPeriod: {type: integer}
        period: {type: string, enum: [DAY, WEEK, MONTH, YEAR]}
        validUntil: {type: string, format: date-time, nullable: true}
        paymentPurpose: {type: string}
        payerHint:
          type: string
          description: Подсказка для оформления согласия (например, телефон плательщика); состав ПДн минимизируется
    Mandate:
      type: object
      required: [mandateId, tspId, status]
      properties:
        mandateId: {type: string}
        tspId: {type: string}
        status:
          type: string
          enum: [PENDING, ACTIVE, REVOKED, EXPIRED, REJECTED]
          description: Состояние мандата — проекция состояния, подтверждённого ОПКЦ СБП
        consentUrl:
          type: string
          nullable: true
          description: Ссылка/диплинк для подписания согласия плательщиком в его банке
        amountLimit: {type: integer}
        periodLimit: {type: integer}
        maxChargesPerPeriod: {type: integer}
        activatedAt: {type: string, format: date-time, nullable: true}
        revokedAt: {type: string, format: date-time, nullable: true}
        validUntil: {type: string, format: date-time, nullable: true}
    ChargeRequest:
      type: object
      required: [invoiceId, amount]
      properties:
        invoiceId:
          type: string
          description: Идентификатор периода подписки; вместе с mandateId образует ключ однократности списания
        amount: {type: integer, description: Сумма в копейках}
        paymentPurpose: {type: string}
    Charge:
      type: object
      required: [chargeId, paymentId, mandateId, invoiceId, amount, status]
      properties:
        chargeId: {type: string}
        paymentId: {type: string}
        mandateId: {type: string}
        invoiceId: {type: string}
        amount: {type: integer}
        status: {type: string, enum: [CREATED, PAID, CREDITED, COMPLETED, FAILED]}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, description: URI типа ошибки}
        title: {type: string}
        status: {type: integer}
        detail: {type: string, nullable: true}
        code:
          type: string
          enum: [INVALID_REQUEST, UNAUTHORIZED, TSP_NOT_ACTIVE, NOT_FOUND, IDEMPOTENCY_CONFLICT, PAYMENT_NOT_REFUNDABLE, AMOUNT_EXCEEDS_PAID, MANDATE_NOT_ACTIVE, MANDATE_LIMIT_EXCEEDED, MANDATE_EXPIRED, MANDATE_UNKNOWN_STATE, CHARGE_ALREADY_EXISTS, RATE_LIMITED, INTERNAL]
        traceId: {type: string}
        idempotencyKey: {type: string}
