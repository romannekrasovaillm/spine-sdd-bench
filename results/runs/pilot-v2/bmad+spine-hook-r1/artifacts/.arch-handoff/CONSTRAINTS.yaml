# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn

  # --- Рекуррентные списания (ADR-008, AD-009, AD-010) ---
  # Архитектурная фаза: правила ниже — текстовые звенья трассировки (наличие инварианта),
  # поведенческих (command_succeeds) проверок нет. Исполняемые правила и негативные тесты
  # AD-009/AD-010 обязательны в handoff реализации (A4).
  - name: recurrent-invariant-in-spine
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-009'
    severity: error
    owner: solution-architect
    expiry: 2027-09-28
  - name: recurrent-consent-authority-in-spine
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-010'
    severity: error
    owner: solution-architect
    expiry: 2027-09-28
  - name: recurrent-no-bypass-paid
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'только из `PAID`'
    severity: error
    owner: solution-architect
    expiry: 2027-09-28
  - name: recurrent-consent-active-mandate
    type: must_contain
    glob: "docs/solutioning-subscriptions.md"
    pattern: 'AD-009'
    severity: error
    owner: solution-architect
    expiry: 2027-09-28
  - name: recurrent-nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '2000/мин'
    severity: error
    owner: solution-architect
    expiry: 2027-09-28
  - name: recurrent-contract-additive
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/consents'
    severity: warn
    owner: solution-architect
    expiry: 2027-09-28
