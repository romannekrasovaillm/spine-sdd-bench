# Рубрика приёмки изменений «СБП-подписки» (якорная, scale 1–5).
name: sbp_recurring_subscriptions_quality
description: "Качество архитектурного пакета рекуррентных C2B-списаний: инварианты, контракты, NFR, критерии приёмки (в т.ч. негативные), план отката"
scale_max: 5
origin: anchor
criteria:
  - id: mandate_model
    name: Модель согласия (мандат)
    description: "Мандат как объект ядра с явным жизненным циклом; списание только из ACTIVE; отзыв блокирует списания"
    weight: 3
    anchors:
      1: "Согласие не формализовано или хранится у ТСП/вендора"
      3: "Мандат описан, но нет состояний отзыва/истечения или не запрещены списания по неактивному мандату"
      5: "Полный автомат, инварианты AD-009/AD-011 проверяемы, связь мандат↔подписка↔списание явная"
  - id: idempotency
    name: Идемпотентность рекуррента
    description: "Ровно одно списание на период; дедуп событий/повторов; нет двойного зачисления"
    weight: 3
    anchors:
      1: "Идемпотентность не определена — возможны двойные списания"
      3: "Ключ идемпотентности назван, но негативные сценарии (повтор, позднее событие) не покрыты"
      5: "Ключ (mandateId, subscriptionId, billingPeriod); тесты повторов идемпотентны (AD-003/AD-010)"
  - id: contract_compat
    name: Совместимость контракта
    description: "Расширение аддитивно; машинная проверка отсутствия ломающих изменений"
    weight: 2
    anchors:
      1: "Контракт переписан/меняет существующие поля или значения status"
      3: "Изменения аддитивны, но проверка не автоматизирована"
      5: "Аддитивно + подтверждено spine contract-diff (breaking: 0); добавлены коды ошибок и события"
  - id: nfr_measurable
    name: Измеримость NFR
    description: "Бюджеты латентности/нагрузки/отзыва с числами и методом проверки"
    weight: 2
    anchors:
      1: "NFR — «быстро/надёжно» без чисел"
      3: "Числа есть, метод проверки/владелец не указаны"
      5: "Каждая цель: метрика + значение + метод (нагрузочный тест/мониторинг/сверка)"
  - id: acceptance_rollback
    name: Приёмка и откат
    description: "Проверяемые критерии с негативными сценариями; явный критерий успешного отката и владелец"
    weight: 2
    anchors:
      1: "Критерии/откат отсутствуют"
      3: "Критерии позитивны, откат упомянут без сигналов/владельца"
      5: "Негативные сценарии (дубль, отзыв, лимит, отказ АБС) + откат с триггерами и владельцем"
