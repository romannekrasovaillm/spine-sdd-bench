# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- Рекуррентные C2B-списания («СБП-подписки»), ADR-008; правки авторизованы
  # дельтой changes/sbp-recurring-subscriptions/DELTA.md ---
  - name: adr-008-present
    type: file_exists
    path: docs/adr/ADR-008-recurring-c2b-subscriptions.md
    severity: error
  - name: mandate-active-only
    type: must_contain
    glob: "docs/spec/mandate-lifecycle.md"
    pattern: 'AD-009'
    severity: error
  - name: recurring-contract-additive
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/mandates'
    severity: error
  - name: recurring-nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Двойные списания'
    severity: error
