openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  # 0.1.0 → 0.2.0: аддитивное расширение — мандаты подписки и рекуррентные списания.
  # Существующие методы (/v1/payments), схемы PaymentRequest/Payment и перечисление
  # Payment.status НЕ изменены; существующие потребители совместимы без адаптации.
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  # --- Аддитивно: мандаты подписки и рекуррентные списания (v0.2.0) ---
  /v1/mandates:
    post:
      operationId: createMandate
      summary: Регистрация мандата подписки (без списания)
      description: Создаёт мандат в состоянии PENDING_CONSENT. Согласие плательщика получается вне шлюза; активация — по подтверждённому событию ОПКЦ.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Мандат зарегистрирован, ожидает подтверждения плательщика
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '409':
          description: IDEMPOTENCY_CONFLICT — ключ использован с другим телом
        '422':
          description: INVALID_REQUEST — некорректные лимиты
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Состояние мандата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '404':
          description: NOT_FOUND
  /v1/mandates/{mandateId}/suspend:
    post:
      operationId: suspendMandate
      summary: Приостановка списаний по мандату (со стороны ТСП)
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Мандат переведён в SUSPENDED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '422':
          description: MANDATE_NOT_ACTIVE — мандат не в состоянии ACTIVE
  /v1/mandates/{mandateId}/resume:
    post:
      operationId: resumeMandate
      summary: Возобновление списаний по мандату
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Мандат переведён в ACTIVE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '422':
          description: MANDATE_NOT_ACTIVE — мандат отозван или истёк; возобновление невозможно
  /v1/mandates/{mandateId}/charges:
    post:
      operationId: createCharge
      summary: Инициирование рекуррентного списания по мандату
      description: Списание проводится без действия плательщика в пределах лимитов; выше порога подтверждения переходит в AWAITING_CONFIRMATION.
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChargeRequest'}
      responses:
        '201':
          description: Списание принято
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Charge'}
        '422':
          description: MANDATE_NOT_ACTIVE | LIMIT_EXCEEDED
  /v1/charges/{chargeId}:
    get:
      operationId: getCharge
      parameters:
        - {in: path, name: chargeId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Состояние списания
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Charge'}
        '404':
          description: NOT_FOUND
  /v1/charges/{chargeId}/refunds:
    post:
      operationId: createChargeRefund
      summary: Возврат по рекуррентному списанию
      description: Использует существующую сагу возвратов; возможен только для зачисленного списания (CREDITED/COMPLETED).
      parameters:
        - {in: path, name: chargeId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChargeRefundRequest'}
      responses:
        '201':
          description: Возврат зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChargeRefund'}
        '422':
          description: AMOUNT_EXCEEDS_PAID | PAYMENT_NOT_REFUNDABLE
  /v1/charges/{chargeId}/refunds/{refundId}:
    get:
      operationId: getChargeRefund
      parameters:
        - {in: path, name: chargeId, required: true, schema: {type: string}}
        - {in: path, name: refundId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус возврата по списанию
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChargeRefund'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
    # --- Аддитивно (v0.2.0) ---
    MandateRequest:
      type: object
      required: [tspId, paymentPurpose, limits]
      properties:
        tspId: {type: string}
        paymentPurpose: {type: string, description: Назначение подписки}
        merchantOrderId: {type: string, description: Сквозной идентификатор ТСП, опционально}
        limits: {$ref: '#/components/schemas/MandateLimits'}
    MandateLimits:
      type: object
      required: [currency, maxAmountPerCharge, maxAmountPerPeriod]
      description: Лимиты мандата; иммутабельны после активации. Изменение — только новый мандат.
      properties:
        currency: {type: string, enum: [RUB]}
        maxAmountPerCharge: {type: integer, description: Максимум одного списания, в копейках}
        maxAmountPerPeriod: {type: integer, description: Максимум суммы за период, в копейках}
        period: {type: string, enum: [DAY, WEEK, MONTH, YEAR]}
        confirmationThreshold: {type: integer, description: Порог суммы, выше которого требуется подтверждение плательщика, в копейках}
    Mandate:
      type: object
      required: [mandateId, tspId, status, limits]
      properties:
        mandateId: {type: string}
        tspId: {type: string}
        status:
          type: string
          enum: [PENDING_CONSENT, ACTIVE, SUSPENDED, REVOKED, EXPIRED]
        limits: {$ref: '#/components/schemas/MandateLimits'}
        consentUrl: {type: string, nullable: true, description: Ссылка/QR для подтверждения согласия плательщиком}
        activatedAt: {type: string, format: date-time, nullable: true}
        expiresAt: {type: string, format: date-time, nullable: true}
    ChargeRequest:
      type: object
      required: [amount, billingPeriod]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        billingPeriod: {type: string, description: Идентификатор итерации подписки; участвует в детерминированном ключе идемпотентности}
        merchantOrderId: {type: string}
        description: {type: string}
    Charge:
      type: object
      required: [chargeId, mandateId, amount, status]
      properties:
        chargeId: {type: string}
        mandateId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, AWAITING_CONFIRMATION, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        confirmationRequired: {type: boolean}
        confirmationExpiresAt: {type: string, format: date-time, nullable: true}
        paymentId: {type: string, nullable: true, description: Итоговый платёжный документ, если списание состоялось}
        merchantOrderId: {type: string}
        errorCode: {type: string, nullable: true}
    ChargeRefundRequest:
      type: object
      properties:
        amount: {type: integer, description: Сумма возврата; по умолчанию — полная; опционально}
        reason: {type: string}
    ChargeRefund:
      type: object
      required: [refundId, chargeId, amount, status]
      properties:
        refundId: {type: string}
        chargeId: {type: string}
        amount: {type: integer}
        status: {type: string, enum: [PENDING, COMPLETED, FAILED]}
        completedAt: {type: string, format: date-time, nullable: true}
