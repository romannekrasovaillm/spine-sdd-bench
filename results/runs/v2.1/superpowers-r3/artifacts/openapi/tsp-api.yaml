openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >-
    v0.2 — аддитивное расширение контракта: рекуррентные C2B-списания по согласию
    плательщика (мандаты). Пути, схемы и обязательные поля v0.1 не изменены;
    потребители v0.1 продолжают работать без миграции.
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      summary: Регистрация мандата (согласия плательщика) на рекуррентные списания
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Мандат зарегистрирован (статус PENDING_CONSENT до подтверждения согласия)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '422':
          description: Ошибка валидации запроса (RFC 9457)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Состояние мандата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
  /v1/mandates/{mandateId}/revoke:
    post:
      operationId: revokeMandate
      summary: Отзыв согласия плательщика; списания по мандату становятся недостижимы
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Согласие отозвано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
  /v1/mandates/{mandateId}/debits:
    post:
      operationId: createDebit
      summary: Рекуррентное списание по мандату; создаёт обычный платёж (без QR)
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DebitRequest'}
      responses:
        '201':
          description: Списание инициировано; возвращается платёж (схема Payment)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '422':
          description: Мандат не активен / превышен лимит / конфликт периода биллинга (RFC 9457)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        mandateId: {type: string, description: 'v0.2 (опц.): мандат, по которому выполнено рекуррентное списание'}
        billingKey: {type: string, description: 'v0.2 (опц.): ключ периода биллинга ТСП'}
    MandateRequest:
      type: object
      required: [tspId, payerRef, maxAmount, currency, period, validUntil]
      properties:
        tspId: {type: string}
        payerRef:
          type: string
          description: Минимизированная ссылка на плательщика (токен); не ПДн в открытом виде
        maxAmount: {type: integer, description: Лимит одного списания в копейках}
        currency: {type: string, enum: [RUB]}
        period:
          type: string
          enum: [MONTHLY, WEEKLY, QUARTERLY, ON_DEMAND]
        validUntil: {type: string, format: date-time}
        paymentPurpose: {type: string}
        merchantOrderId: {type: string}
    Mandate:
      type: object
      required: [mandateId, status, maxAmount, currency, period, validUntil]
      properties:
        mandateId: {type: string}
        status:
          type: string
          enum: [PENDING_CONSENT, ACTIVE, SUSPENDED, REVOKED, EXPIRED, REJECTED]
        maxAmount: {type: integer, description: Лимит одного списания в копейках}
        currency: {type: string, enum: [RUB]}
        period:
          type: string
          enum: [MONTHLY, WEEKLY, QUARTERLY, ON_DEMAND]
        validUntil: {type: string, format: date-time}
        consentUrl: {type: string, description: Ссылка/QR для получения согласия плательщика (по механизму ОПКЦ)}
        errorCode: {type: string, nullable: true}
        merchantOrderId: {type: string}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    DebitRequest:
      type: object
      required: [amount, billingKey]
      properties:
        amount: {type: integer, description: Сумма в копейках; не больше maxAmount мандата}
        billingKey:
          type: string
          description: Ключ периода/события биллинга ТСП; идемпотентность по паре (mandateId, billingKey)
        paymentPurpose: {type: string}
        merchantOrderId: {type: string}
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        traceId: {type: string}
        idempotencyKey: {type: string}
