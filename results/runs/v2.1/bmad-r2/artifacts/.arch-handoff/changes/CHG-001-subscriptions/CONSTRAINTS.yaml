# Fitness-правила дельты CHG-001 (подписки СБП).
# Схема control::check. Применяются ПОСЛЕ ратификации ADR-008 и после перегенерации
# базового handoff-пакета под кодовый харнесс. Дополняют базовый CONSTRAINTS.yaml.

rules:
  - name: mandate-active-gate
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'только при мандате в состоянии `ACTIVE`'
    severity: error
  - name: single-money-path
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'рекуррентное списание — это платёж'
    severity: error
  - name: payment-status-unchanged
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: 'enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]'
    severity: error
  - name: mandate-status-separate-enum
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: 'MandateStatus'
    severity: error
  - name: debit-idempotency-key
    type: must_contain
    glob: "docs/contracts/tsp-api.md"
    pattern: '(mandateId, billingRef)'
    severity: error
  - name: contract-additive-version
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: 'version: 0.2.0'
    severity: error
  - name: mandate-nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Двойное списание при повторе'
    severity: error
  - name: no-breaking-v2
    type: must_not_contain
    glob: "docs/contracts/tsp-api.md"
    pattern: 'Ломающие изменения — только в `/v1`'
    severity: warn
