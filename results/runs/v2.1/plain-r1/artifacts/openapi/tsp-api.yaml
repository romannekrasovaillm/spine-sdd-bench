openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >-
    Аддитивное расширение v0.1 → v0.2: подписки СБП (рекуррентные C2B-списания).
    Существующие пути, обязательные поля и значения enum не изменены (обратная совместимость).
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/subscriptions:
    post:
      operationId: createSubscription
      description: Регистрация подписки (мандата) с согласием плательщика. Регистрация в ОПКЦ — асинхронно.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionRequest'}
      responses:
        '201':
          description: Подписка создана (ожидает подтверждения ОПКЦ)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
  /v1/subscriptions/{subscriptionId}:
    get:
      operationId: getSubscription
      parameters:
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус подписки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
  /v1/subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelSubscription
      description: Отмена подписки / отзыв согласия. Новые циклы списания блокируются.
      parameters:
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Подписка отменена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
  /v1/subscriptions/{subscriptionId}/cycles:
    get:
      operationId: listSubscriptionCycles
      description: Список циклов списания (платежей) по подписке.
      parameters:
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Циклы списания
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Payment'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        # v0.2: опциональные поля; для разовых платежей не заполняются.
        subscriptionId:
          type: string
          description: Идентификатор подписки, если платёж является циклом списания (v0.2)
        debitType:
          type: string
          description: Тип списания (v0.2); по умолчанию ONE_TIME
          enum: [ONE_TIME, RECURRING]
    SubscriptionRequest:
      type: object
      required: [tspId, amount, schedule]
      properties:
        tspId: {type: string}
        amount: {type: integer, description: Сумма списания в копейках}
        currency: {type: string, description: "ISO 4217; по умолчанию RUB"}
        merchantOrderId: {type: string}
        paymentPurpose: {type: string}
        schedule: {$ref: '#/components/schemas/DebitSchedule'}
        ttlSeconds: {type: integer, description: "Срок действия согласия в секундах; опц."}
    DebitSchedule:
      type: object
      required: [period]
      properties:
        period: {type: string, enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY]}
        dayOfMonth: {type: integer, description: "День месяца для MONTHLY/QUARTERLY; опц."}
        startAt: {type: string, description: "Начало списаний, ISO 8601 UTC; опц."}
        maxCycles: {type: integer, description: "Ограничение числа циклов; опц."}
    Subscription:
      type: object
      required: [subscriptionId, status]
      properties:
        subscriptionId: {type: string}
        tspId: {type: string}
        amount: {type: integer}
        status:
          type: string
          enum: [PENDING_OPKC, ACTIVE, SUSPENDED, CANCELLED, DECLINED, EXPIRED]
        schedule: {$ref: '#/components/schemas/DebitSchedule'}
        createdAt: {type: string}
        nextDebitAt: {type: string}
