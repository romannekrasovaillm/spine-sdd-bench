openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/consents:
    post:
      operationId: createConsent
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentRequest'}
      responses:
        '201':
          description: Согласие зарегистрировано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
  /v1/consents/{consentId}:
    get:
      operationId: getConsent
      parameters:
        - {in: path, name: consentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус согласия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
  /v1/consents/{consentId}/revoke:
    post:
      operationId: revokeConsent
      parameters:
        - {in: path, name: consentId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Согласие отозвано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
        consentId:
          type: string
          description: ID активного согласия; если задан — рекуррентное списание без QR (взаимоисключает qrType)
        billingPeriodKey:
          type: string
          description: Ключ периода выставления для идемпотентности рекуррентного списания
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        paymentType:
          type: string
          enum: [qr, recurring]
        consentId:
          type: string
          description: ID согласия для рекуррентного платежа
    ConsentRequest:
      type: object
      required: [tspId, maxAmountPerDebit, maxFrequency, validUntil]
      properties:
        tspId: {type: string}
        consentId: {type: string, description: Опц.; если не задан — генерирует шлюз}
        payerIdentifier: {type: string}
        maxAmountPerDebit: {type: integer, description: Лимит на одно списание, копейки}
        maxFrequency: {type: string, enum: [DAILY, WEEKLY, MONTHLY, CUSTOM]}
        validUntil: {type: string, format: date-time}
        purpose: {type: string}
        redirectUrl: {type: string}
    Consent:
      type: object
      required: [consentId, status]
      properties:
        consentId: {type: string}
        status:
          type: string
          enum: [CREATED, ACTIVE, REVOKED, EXPIRED]
        maxAmountPerDebit: {type: integer}
        maxFrequency: {type: string}
        validUntil: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        revokedBy: {type: string}
