# A3 — человеческое архитектурное решение (машинно-читаемый пакет)
# Подписки СБП (рекуррентные C2B-списания по согласию плательщика)
# ВНИМАНИЕ: decided_by / decided_at заполняет ЧЕЛОВЕК-архитектор. Агент оставляет их пустыми.

change: sbp-recurring-subscriptions
route: critical                 # significance_score: score 8
status: proposed                # proposed -> accepted | rejected (после A3)
decided_by: ""                  # ← человек-архитектор
decided_at: ""                  # ← дата решения

choice:
  consent_model: "согласие плательщика — first-class сущность; в шлюзе — локальная проекция авторитетного реестра"   # ADR-008
  billing_trigger: "ТСП-драйвер: шлюз не хранит расписание и не инициирует списания сам"                              # ADR-009
  idempotency: "составной ключ (consentId, billingPeriod); окно хранения = срок жизни согласия"                        # ADR-010
  revocation: "fail-closed; применение отзыва p95 <= 30 c, p99 <= 60 c"                                                # ADR-010

rationale: >
  Рекуррентные списания — финансово значимое действие без участия плательщика в каждом цикле. Согласие как сущность
  даёт выразимые лимиты, отзыв и аудит (требования 161-ФЗ и защита прав плательщика) и переиспользует принятый автомат
  платежа: зачисление на счёт ТСП по-прежнему только из PAID (AD-005), нового пути зачисления нет. ТСП-драйвер
  сохраняет изоляцию контура (AD-001) и не создаёт нового критического компонента-планировщика. Идемпотентность цикла
  закрывает главный финансовый риск — повторное удержание денег плательщика.

constraints:
  - "Зачисление на счёт ТСП только из PAID (AD-005) — без исключений для рекуррентных списаний"
  - "Единственный адаптер ОПКЦ (AD-004): протокол согласий НСПК — внутри вендора (ADR-007/AD-008)"
  - "RPO=0 по согласиям и ключам идемпотентности; RTO <= 1 ч"
  - "Списание только по ACTIVE и в пределах лимитов; отзыв — fail-closed"
  - "Trust-зоны и СКЗИ (AD-006) без изменений; ПДн согласия — минимизация и защита (AD-007)"
  - "Контракт ТСП версии 0.1.0 не ломается (openapi 0.2.0 аддитивна)"

rejected_options:
  - id: vendor-only-consent
    why: "нет локального аудита и контроля лимитов, vendor lock-in, ломает AD-001/AD-008"
  - id: gateway-scheduler
    why: "новый критический компонент (выборы лидера, DR), финансово проактивный шлюз, риск двойных списаний; отложен как отдельный ADR"
  - id: flat-recurring-flag
    why: "невозможно выразить лимиты, срок действия и отзыв; контроль размазан по платежам"
  - id: idempotency-24h-only
    why: "дубли при ретрае через сутки => повторное удержание денег плательщика; неприемлемо"

expiry: >
  Ревизия при получении протокола НСПК по согласиям/автоплатежам (внешний вход) и через 12 месяцев боевой эксплуатации.

open_questions:
  - "Протокол НСПК по согласиям/автоплатежам: операции, поля, тайминги, правила отзыва [ТРЕБУЕТ ПРОВЕРКИ — внешний вход по договору]"
  - "Где авторитетный реестр согласий: НСПК, банк плательщика или шлюз-эквайер — зависит от протокола"
  - "Регуляторная модель прав плательщика: обязательное предварительное уведомление перед каждым списанием? форма согласия? лимиты по умолчанию? (юр/комплаенс)"
  - "Нужен ли статус SUSPENDED (пауза) в первой волне или достаточно ACTIVE/REVOKED"
  - "Коммерческая модель подписок (тарифы/комиссии ТСП) — бизнес"
  - "Нужны ли диспуты по рекуррентным списаниям в первой волне"
  - "Порог свежести локальной проекции согласия (предлагается 300 с) и политика компенсации in-flight при отзыве"

