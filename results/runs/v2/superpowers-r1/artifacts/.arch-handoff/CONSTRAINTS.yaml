# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- AD-009: рекуррентные списания (изменение changes/sbp-subscriptions) ---
  - name: ad-009-invariant-present
    type: must_contain
    path: ARCHITECTURE-SPINE.md
    pattern: 'только по действующему мандату'
    severity: error
    rationale: 'инвариант AD-009 обязан присутствовать в spine (ADR-008)'
    fix_hint: 'вернуть блок AD-009 в ARCHITECTURE-SPINE.md'
  - name: subscription-model-exists
    type: file_exists
    path: docs/spec/subscription-model.md
    severity: error
    rationale: 'модель мандата и рекуррентного списания обязательна для реализации (ADR-008)'
  - name: subscription-model-active-guard
    type: must_contain
    glob: "docs/spec/subscription-model.md"
    pattern: 'ACTIVE'
    severity: error
    rationale: 'спецификация мандата обязана фиксировать состояние ACTIVE как условие списания'
  - name: subscription-nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Рекуррентные списания'
    severity: error
    rationale: 'для рекуррентного функционала обязательны измеримые NFR (ADR-008)'
  - name: tsp-api-version-v02
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '0.2.0'
    severity: warn
    rationale: 'контракт API ТСП расширен до v0.2 (подписки, ADR-008)'
