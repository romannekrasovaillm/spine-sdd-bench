# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  # --- Изменение sbp-subscriptions (ADR-008..010, AD-009..011 spine) ---
  # AD-009: согласие до автодействия — мандат, лимиты и запрет списания без ACTIVE.
  - name: mandate-consent-before-charge
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'единый источник истины'
    severity: error
  - name: mandate-state-machine-present
    type: must_contain
    glob: "docs/spec/subscriptions.md"
    pattern: 'Таблица переходов мандата'
    severity: error
  - name: consent-documented-as-append-only
    type: must_contain
    glob: "docs/adr/ADR-009-*.md"
    pattern: 'append-only'
    severity: warn
  # AD-010: неопределённый исход списания — без повторной отправки.
  - name: unknown-outcome-no-resend-documented
    type: must_contain
    glob: "docs/adr/ADR-010-*.md"
    pattern: 'неопределённ'
    severity: error
  # Spine: новые инварианты обязаны присутствовать.
  - name: spine-subscription-invariants
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-009|AD-010|AD-011'
    severity: error
  # Контракт v0.2 расширен аддитивно (подписки) — поле subscriptionId обязательно.
  - name: tsp-contract-subscription-field
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: 'subscriptionId'
    severity: error
  # Дельта изменения обязательна на маршруте Critical.
  - name: subscription-delta-present
    type: file_exists
    path: "changes/sbp-subscriptions/DELTA.md"
    severity: error
  # Критерии приёмки — в EARS-форме (кандидат rules-suggest, скилл readiness-gate).
  - name: ears_acceptance_criteria
    type: must_contain
    glob: 'docs/**/*.md'
    pattern: '(?m)^\s*[-*]?\s*\**\s*(When|While|If|Where)\b'
    severity: warn
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
