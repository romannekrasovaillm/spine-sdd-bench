# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn

  # --- Подписки СБП (ADR-008/009/010): инварианты рекуррентных списаний ---
  - name: adr-subscriptions-present
    type: file_exists
    path: docs/adr/ADR-008-podpiski-sbp-soglasie-platelshchika-kak-istochnik-istiny.md
    severity: error
  - name: spine-consent-source-of-truth
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'только при состоянии согласия `ACTIVE`'
    severity: error
  - name: spine-debit-period-idempotency
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: '\(subscriptionId, billingPeriod\)'
    severity: error
  - name: tsp-api-subscriptions-present
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/subscriptions'
    severity: error
  - name: tsp-api-version-bumped
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: 'version: 0.2.0'
    severity: warn
  - name: subscription-spec-acceptance
    type: must_contain
    glob: "docs/spec/subscription-state-machine.md"
    pattern: '## Критерии приёмки'
    severity: warn
  - name: nfr-subscriptions-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Подписки СБП'
    severity: warn
