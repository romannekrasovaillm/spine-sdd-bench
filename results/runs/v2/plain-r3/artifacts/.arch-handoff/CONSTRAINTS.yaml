# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- Дельта sbp-recurring-subscriptions (подписки СБП) ---
  - name: adr-recurring-present
    type: file_exists
    path: docs/adr/ADR-008-podpiski-sbp-domen-soglasiy-i-podpisok-iniciaciya-rekurrentnyh-spisaniy.md
    severity: error
  - name: consent-data-protection-adr
    type: file_exists
    path: docs/adr/ADR-009-zaschita-dannyh-soglasiya-platelschika-i-garantiya-zapreta-spisaniy-posle-otzyva.md
    severity: error
  - name: recurring-only-with-active-consent
    type: must_contain
    glob: "docs/adr/ADR-008-podpiski-sbp-domen-soglasiy-i-podpisok-iniciaciya-rekurrentnyh-spisaniy.md"
    pattern: 'ACTIVE'
    severity: error
  - name: recurring-idempotency-key
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'consentId, billingKey'
    severity: error
  - name: consent-revocation-nfr
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Списание при неактивном согласии'
    severity: error
  - name: tsp-api-consent-endpoints
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/consents'
    severity: error
  - name: delta-guard-covered
    type: file_exists
    path: changes/sbp-recurring-subscriptions/DELTA.md
    severity: error
