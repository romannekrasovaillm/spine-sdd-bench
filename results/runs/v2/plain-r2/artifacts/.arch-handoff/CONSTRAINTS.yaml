# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn

  # --- Изменение: СБП-подписки (changes/sbp-subscriptions, ADR-008, AD-009) ---
  # Аддитивные правила; существующие не ослабляются. Действуют как живая истина
  # после влития дельты (архивация без влития = правила удаляются вместе с ADR-008).
  - name: adr-008-subscriptions-present
    type: file_exists
    path: docs/adr/ADR-008-rekurrentnye-c2b-spisaniya-podpiski-sbp.md
    severity: error
  - name: spine-consent-invariant-present
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-009'
    severity: error
  - name: consent-state-machine-present
    type: must_contain
    glob: "docs/spec/state-machine.md"
    pattern: 'Машина согласия'
    severity: error
  - name: subscriptions-nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Инициация списания от срока'
    severity: error
  - name: tsp-api-consents-contract
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/consents'
    severity: error
  # Обязательное основание списания: списание только по ACTIVE-согласию (AD-009).
  - name: debit-only-by-active-consent
    type: must_contain
    glob: "docs/spec/state-machine.md"
    pattern: 'Списание невозможно ни из одного состояния, кроме `ACTIVE`'
    severity: error
  - name: ears-acceptance-criteria
    type: must_contain
    glob: 'docs/**/*.md'
    pattern: '(?m)^\s*[-*]?\s*\**\s*(When|While|If|Where)\b'
    severity: warn
