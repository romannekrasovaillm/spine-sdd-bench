# Рубрика приёмки изменения «СБП-подписки» (handoff-пакет к кодовому харнессу).
# Якорная шкала 1–5; оценивает и пакет, и результат прогона.
name: sbp_subscriptions_change
description: "Качество архитектурного пакета и реализации СБП-подписок: инварианты согласия, идемпотентность списаний, негативные сценарии, откат, контракт результата"
scale_max: 5
origin: anchor
criteria:
  - id: consent_invariant
    name: Инвариант согласия
    description: "Списание невозможно без ACTIVE-согласия; согласие — второй источник истины; отзыв необратим и приоритетен"
    weight: 3
    anchors:
      1: "Списание возможно без действующего согласия или отзыв не останавливает списания"
      3: "Guard есть, но отзыв/приоритет/атомарность покрыты частично"
      5: "AD-009 выполнен: guard ACTIVE, атомарные переходы согласия, необратимый отзыв; подтверждено тестом/цитатой"
  - id: idempotency
    name: Идемпотентность списаний
    description: "Повтор тика планировщика или запроса ТСП не создаёт второе списание; ключ consentId + billingPeriod"
    weight: 3
    anchors:
      1: "Повтор создаёт второе списание или зачисление"
      3: "Идемпотентность есть на одном из путей (планировщик или API)"
      5: "Оба пути идемпотентны; негативный тест на дубль приведён и проходит"
  - id: credit_only_from_paid
    name: Зачисление только из PAID
    description: "ACTIVE-согласие не является основанием зачисления; АБС вызывается только из PAID"
    weight: 3
    anchors:
      1: "Зачисление возможно из состояния согласия/создания"
      3: "Правило заявлено, но не проверено тестом/цитатой"
      5: "Правило выполнено и подтверждено fitness/тестом (AD-005)"
  - id: negative_scenarios
    name: Негативные сценарии
    description: "Покрыты: списание без согласия, отзыв in-flight, недоступность АБС, рестарт планировщика, конфликт Idempotency-Key"
    weight: 2
    anchors:
      1: "Только счастливый путь"
      3: "Часть негативных сценариев покрыта"
      5: "Все перечисленные сценарии покрыты проверяемыми тестами"
  - id: rollback
    name: План отката
    description: "Фиче-флаг, stop-new с доработкой открытых операций, сигналы-триггеры и владелец решения"
    weight: 2
    anchors:
      1: "Откат не описан"
      3: "Откат описан общими словами без сигналов/владельца"
      5: "Пошаговый откат с триггерами и владельцем; согласован с обратимостью ADR-008"
  - id: result_contract
    name: Контракт результата (headless JSON)
    description: "Финал прогона — JSON complete/partial/blocked с assumptions/open_questions/conflicts_with_prior_decisions"
    weight: 1
    anchors:
      1: "Формат не соблюдён, итог — проза"
      3: "JSON есть, но конфликты не эскалируются"
      5: "Полный контракт; conflicts_with_prior_decisions останавливает работу и эскалирует"
