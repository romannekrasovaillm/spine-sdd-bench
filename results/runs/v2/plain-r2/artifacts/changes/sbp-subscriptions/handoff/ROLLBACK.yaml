# План отката изменения «СБП-подписки».
# Согласован с ADR-008 (§Reversibility, costly после включения) и DELTA.md (§План отката).
name: sbp-subscriptions-rollback
owner: владелец продукта «СБП-подписки» + solution-architect (платёжный контур)
executor: SRE дежурная смена (по runbook) + команда шлюза
decision_authority: A3-владелец (бизнес + архитектор) — решение об откате после включения

# Фазы обратимости
phases:
  - id: proposed
    condition: "ADR-008 = Proposed; кода нет"
    action: "Отклонение A3: заархивировать дельту без влития; ADR-008 и AD-009 вернуть к базовому коммиту"
    cost: "нулевая"
    reversible: true
  - id: implemented_flag_off
    condition: "код залит, sbp.subscriptions.enabled = false"
    action: "Выключить флаг: согласия — только тестовый контур, планировщик остановлен; боевой приём не затронут"
    cost: "низкая"
    reversible: true
  - id: enabled_staged
    condition: "флаг включён поэтапно по сегментам ТСП"
    action: "stop-new: остановить планировщик + отклонять POST /v1/consents; открытые согласия и списания дорабатываются; откат релиза — rolling; данные не мигрируются обратно"
    cost: "средняя (интеграции ТСП)"
    reversible: partial

# Сигналы-триггеры отката (любой → остановка включения и разбор)
triggers:
  - id: duplicate_debit
    signal: "двойное списание на один consentId + billingPeriod > 0"
    severity: critical
  - id: revocation_not_honored
    signal: "после отзыва новое списание или нарушение срока ≤ 60 с"
    severity: critical
  - id: consent_integrity
    signal: "инцидент целостности согласий / расхождение сверки согласие↔списания↔АБС"
    severity: critical
  - id: nspk_nonconformance
    signal: "несоответствие требованиям НСПК по подпискам"
    severity: high
  - id: regulator
    signal: "предписание регулятора"
    severity: critical

steps:
  - "1. Объявить stop-new: выключить планировщик (флаг планировщика), включить отклонение POST /v1/consents (503/422 с кодом)."
  - "2. Убедиться, что открытые согласия и in-flight списания доводятся; ничего не «подвешивать»."
  - "3. Проверить сверку: согласие↔списания↔АБС; расхождения → DLQ + runbook."
  - "4. Уведомить ТСП (вебхуки/статус-страница) и поддержку; зафиксировать инцидент."
  - "5. Откат релиза — rolling (без downtime); новые таблицы аддитивны, обратной миграции нет."
  - "6. Согласия остаются читаемыми (GET), новые не создаются; данные не удаляются."

success_criteria:
  - "новые списания по затронутым согласиям = 0"
  - "сверка согласие↔списания↔АБС: расхождений = 0"
  - "открытые согласия/списания доведены или переведены в терминальное состояние с аудитом"
  - "приём разовых платежей (v0.1) не затронут: доступность ≥ 99,95 %, доступность регистрации QR не снижена"
