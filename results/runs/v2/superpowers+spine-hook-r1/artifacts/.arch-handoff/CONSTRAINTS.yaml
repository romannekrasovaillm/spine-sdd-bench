# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn

  # --- Эпик «СБП-подписки» (ADR-008; дельта changes/sbp-subscriptions/DELTA.md).
  # Правила-упоминания дают звено трассировки AD-009..AD-012; поведенческие проверки
  # (command_succeeds, шаблоны исполняемых правил) добавляются на handoff-этапе, когда
  # появится код и моки — до тех пор исполнять нечего.
  - name: adr-subscriptions-exists
    type: file_exists
    path: docs/adr/ADR-008-sbp-podpiski-rekurrentnye-c2b-spisaniya-po-soglasiyu-platelschika.md
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: spine-subscription-mandate-only
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-009. Рекуррентное списание только по действующему согласию'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: spine-subscription-revoke
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-010. Отзыв согласия немедленно прекращает будущие списания'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: spine-subscription-idempotency
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-011. Идемпотентность рекуррентного списания'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: spine-subscription-notify
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-012. Уведомление плательщика и основание списания'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: mandate-state-machine-exists
    type: file_exists
    path: docs/spec/mandate-state-machine.md
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: mandate-charge-only-when-active
    type: must_contain
    glob: "docs/spec/mandate-state-machine.md"
    pattern: 'Списание невозможно при согласии не в `ACTIVE`'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: tsp-contract-mandates-additive
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/mandates'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: subscription-nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Рекуррентные платежи'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: subscription-delta-present
    type: file_exists
    path: changes/sbp-subscriptions/DELTA.md
    severity: warn
    owner: solution-architect
    expiry: 2027-03-31
