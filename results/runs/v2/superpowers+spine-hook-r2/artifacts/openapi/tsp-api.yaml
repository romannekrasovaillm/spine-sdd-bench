openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >
    Контракт API ТСП версии 0.2 (аддитивное расширение v0.1: подписки —
    рекуррентные C2B-списания по согласию плательщика). Путь остаётся /v1;
    существующие схемы и обязательные поля v0.1 не изменены.
tags:
  - name: payments
  - name: consents
paths:
  /v1/payments:
    post:
      tags: [payments]
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      tags: [payments]
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/consents:
    post:
      tags: [consents]
      operationId: createConsent
      summary: Регистрация согласия плательщика на периодические списания
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentRequest'}
      responses:
        '201':
          description: Согласие зарегистрировано (PENDING, ожидает подтверждения)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
        '422':
          description: Некорректные границы согласия
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/consents/{consentId}:
    get:
      tags: [consents]
      operationId: getConsent
      parameters:
        - {in: path, name: consentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус согласия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
  /v1/consents/{consentId}/revoke:
    post:
      tags: [consents]
      operationId: revokeConsent
      summary: Отзыв согласия (идемпотентно, необратимо)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
        - {in: path, name: consentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Согласие отозвано (REVOKED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
        '409':
          description: Согласие уже неактивно
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
        consentId:
          type: string
          description: >
            Необязательно. Ссылка на согласие, если платёж выполняется в его
            рамках (ad-hoc дебет). Отсутствует для разового платежа.
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        consentId:
          type: string
          description: Ссылка на согласие для периодического списания (иначе отсутствует)
        paymentType:
          type: string
          enum: [SINGLE, RECURRING]
          default: SINGLE
        periodNumber:
          type: integer
          description: Номер периода согласия (только для RECURRING)
    ConsentRequest:
      type: object
      required: [tspId, payerRef, amountType, periodicity]
      properties:
        tspId: {type: string}
        payerRef:
          type: string
          description: Идентификатор плательщика (минимизированный; формат уточняется с НСПК)
        amountType: {$ref: '#/components/schemas/AmountType'}
        amount: {type: integer, description: Сумма в копейках (обязательна при amountType=FIXED)}
        maxAmount: {type: integer, description: Сумма в копейках (обязательна при amountType=VARIABLE_WITH_LIMIT)}
        currency: {type: string, default: RUB}
        periodicity: {$ref: '#/components/schemas/Periodicity'}
        validUntil: {type: string, format: date-time}
        paymentPurpose: {type: string}
        merchantOrderId: {type: string}
    Consent:
      type: object
      required: [consentId, status, amountType, periodicity]
      properties:
        consentId: {type: string}
        status: {$ref: '#/components/schemas/ConsentStatus'}
        tspId: {type: string}
        amountType: {$ref: '#/components/schemas/AmountType'}
        amount: {type: integer}
        maxAmount: {type: integer}
        currency: {type: string}
        periodicity: {$ref: '#/components/schemas/Periodicity'}
        validUntil: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        errorCode: {type: string, nullable: true}
    AmountType:
      type: string
      enum: [FIXED, VARIABLE_WITH_LIMIT]
    Periodicity:
      type: string
      enum: [WEEKLY, MONTHLY, QUARTERLY, ANNUALLY]
    ConsentStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, REVOKED, EXPIRED, REJECTED]
      description: >
        REVOKED/EXPIRED/REJECTED — терминальные. Дебеты разрешены только в ACTIVE.
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 (application/problem+json)
      required: [title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          enum: [INVALID_REQUEST, UNAUTHORIZED, TSP_NOT_ACTIVE, NOT_FOUND, IDEMPOTENCY_CONFLICT, PAYMENT_NOT_REFUNDABLE, AMOUNT_EXCEEDS_PAID, CONSENT_NOT_ACTIVE, CONSENT_LIMIT_EXCEEDED, CONSENT_EXPIRED, RATE_LIMITED, INTERNAL]
        traceId: {type: string}
