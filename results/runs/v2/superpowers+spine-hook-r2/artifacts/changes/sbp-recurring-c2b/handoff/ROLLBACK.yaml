# План отката handoff-пакета (машиночитаемый) — репетируется на гейте A4:
# `arch control gate A4 <repo> --rehearse`. Файл НЕ затирается повторной
# генерацией. Репетиция отклоняет шаги с внешними/деструктивными эффектами,
# поэтому ниже два блока: (1) локальный git-якорь, пригодный для репетиции;
# (2) операционный откат фичи после боевого включения — вручную по runbook,
# НЕ репетируется автоматически (помечен rehearsal: manual). Пакет —
# pre-A3 (ADR-008..011 Proposed); перед передачей после A3 baseline
# актуализируется повторной генерацией.
baseline_commit: "a5df5aa"
steps:
  - name: якорь-доступен
    run: git cat-file -t a5df5aa
  - name: откат-на-baseline
    run: git reset --hard a5df5aa
verify: test -z "$(git status --porcelain --untracked-files=no)"

operational_rollback:
  rehearsal: manual
  owner: solution-architect + бизнес (остановка биллинга затрагивает выручку ТСП и обязательства)
  signals:
    - >0 списаний после подтверждённого отзыва
    - >0 дублей списаний за период (consentId+periodNumber)
    - расхождения согласий при сверке с НСПК
    - недоступность контура согласий
    - каскадные ошибки протокола НСПК
  steps:
    - name: запретить регистрацию новых согласий (feature flag stop-new)
      note: приём новых подписок останавливается
    - name: сохранить отзыв и исполнение действующих обязательств
      note: право плательщика на отзыв и действующие согласия НЕ отключаются
    - name: синхронная сверка согласий с НСПК
      note: до любого решения о заморозке исполнения
    - name: заморозка плановых списаний по каждому согласию
      note: только после сверки; каждое согласие либо исполняется по runbook, либо приостановлено с уведомлением ТСП
    - name: уведомить ТСП и дежурную смену, обновить отчёт незавершённых операций
  success_criteria:
    - 0 новых согласий
    - 0 несанкционированных списаний
    - каждое действующее согласие исполняется по runbook либо корректно приостановлено с уведомлением ТСП
    - отзыв согласия работает
  data: согласия не мигрируются обратно; шлюз остаётся источником истины по согласиям до полной сверки с НСПК
