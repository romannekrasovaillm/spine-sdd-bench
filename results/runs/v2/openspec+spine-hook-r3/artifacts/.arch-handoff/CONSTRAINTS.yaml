# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn

  # --- Подписки СБП (change sbp-subscriptions; ADR-008, ADR-009; AD-009..AD-011) ---
  # Артефакты решения (проверяются уже сейчас).
  - name: subscriptions-contract-present
    type: file_exists
    path: docs/contracts/subscriptions-api.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: subscriptions-spec-present
    type: file_exists
    path: docs/spec/subscriptions.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: subscriptions-nfr-present
    type: file_exists
    path: docs/nfr-subscriptions.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: adr-subscriptions-present
    type: file_exists
    path: docs/adr/ADR-008-podpiski-sbp-mandat-platelschika-kak-istochnik-prava-na-rekurrentnoe-spisanie.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  # Совместимость: расширение «подписки» НЕ добавляет значений в Payment.status.
  # Правило с зубами: добавление нового статуса ломает канонический enum и валит гейт.
  - name: payment-status-frozen
    type: must_contain
    glob: openapi/tsp-api.yaml
    pattern: 'enum: \[CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED\]'
    severity: error
    ad: AD-005
    adr: ADR-009
    rationale: расширение «подписки» не должно добавлять значения в Payment.status (совместимость потребителей)
    fix_hint: отказ списания выражается существующим FAILED + errorCode
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
    covers: ["openspec:subscriptions#9282c139"]
  # Контрактные инварианты, зафиксированные в спецификации списаний (трассировка AD-009/AD-010).
  - name: mandate-revocation-blocks-debits-documented
    type: must_contain
    glob: docs/spec/subscriptions.md
    pattern: 'времени отзыва'
    severity: error
    ad: AD-011
    adr: ADR-009
    rationale: правило «списание с плановым временем позже отзыва невозможно» обязано быть в спецификации
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
    covers: ["openspec:mandates#d90bd3ba"]
  - name: mandate-debit-idempotency-key-documented
    type: must_contain
    glob: docs/spec/subscriptions.md
    pattern: 'subscriptionId, billingPeriod'
    severity: error
    ad: AD-010
    adr: ADR-009
    rationale: ключ идемпотентности рекуррентного списания — (subscriptionId, billingPeriod)
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
    covers: ["openspec:subscriptions#d7e24da7"]
  - name: subscriptions-additive-only-documented
    type: must_contain
    glob: docs/contracts/tsp-api.md
    pattern: 'аддитивно'
    severity: warn
    rationale: правило аддитивности расширения контракта обязано быть явно записано
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  # Поведенческие инварианты: на этапе решения исполнять нечего (код не написан) —
  # осознанный ручной контроль. При реализации заменяются command_succeeds
  # (каркас: `arch-be rules template show idempotency-key`), см. tasks.md §7.
  - name: ad009-debit-only-with-active-mandate
    unverifiable: true
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
    ad: AD-009
    adr: ADR-008
    rationale: списание без действующего мандата или вне лимитов — нарушение права плательщика
    covers: ["openspec:mandates#3319d1f2", "openspec:mandates#1e3beb65"]
  - name: ad010-one-debit-per-period
    unverifiable: true
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
    ad: AD-010
    adr: ADR-009
    rationale: двойное списание за период — финансовый инцидент
    covers: ["openspec:subscriptions#bbf31caa", "openspec:subscriptions#326c73d3", "openspec:subscriptions#25032ca8"]
  - name: ad011-revocation-and-retry-terminal
    unverifiable: true
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
    ad: AD-011
    adr: ADR-009
    rationale: списание после отзыва или неверная обработка отказа периода — клиентский/регуляторный инцидент
    covers: ["openspec:subscriptions#33f6cd83", "openspec:subscriptions#73312c43"]
  - name: mandate-payer-notification-and-audit
    unverifiable: true
    owner: ИБ/комплаенс банка
    expiry: 2027-03-31
    ad: AD-011
    adr: ADR-008
    rationale: уведомление плательщика и неизменяемый аудит — регуляторное обязательство, проверяется регламентом и аудитом
    covers: ["openspec:mandates#227f5f32", "openspec:mandates#2e0b53ee"]
