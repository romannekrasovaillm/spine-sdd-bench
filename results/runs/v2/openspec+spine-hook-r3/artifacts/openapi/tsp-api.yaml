openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >
    Аддитивное расширение v0.1: добавлены мандаты (согласие плательщика) и подписки СБП.
    Существующие пути, поля, статусы и события не меняются; новых значений Payment.status нет.
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Мандат зарегистрирован, ожидает подтверждения плательщика
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '403':
          description: ТСП не активен
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Ошибка запроса
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус мандата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '404':
          description: Мандат не найден
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/subscriptions:
    post:
      operationId: createSubscription
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionRequest'}
      responses:
        '201':
          description: Подписка создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '422':
          description: Мандат не активен или превышен лимит
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/subscriptions/{subscriptionId}:
    get:
      operationId: getSubscription
      parameters:
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус подписки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '404':
          description: Подписка не найдена
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/subscriptions/{subscriptionId}/pause:
    post:
      operationId: pauseSubscription
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Подписка приостановлена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '422':
          description: Подписка не может быть приостановлена
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/subscriptions/{subscriptionId}/resume:
    post:
      operationId: resumeSubscription
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Подписка возобновлена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '422':
          description: Мандат не активен
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelSubscription
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Подписка отменена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '404':
          description: Подписка не найдена
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/subscriptions/{subscriptionId}/debits:
    get:
      operationId: listSubscriptionDebits
      parameters:
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Список списаний по подписке
          content:
            application/json:
              schema:
                type: object
                required: [debits]
                properties:
                  debits:
                    type: array
                    items: {$ref: '#/components/schemas/Debit'}
        '404':
          description: Подписка не найдена
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        subscriptionId: {type: string, nullable: true, description: Подписка, если платёж — рекуррентное списание}
        mandateId: {type: string, nullable: true, description: Мандат, санкционировавший списание}
        billingPeriod: {type: string, nullable: true, description: Период списания, напр. 2026-10}
        errorCode: {type: string, nullable: true, description: Код отказа, если status=FAILED}
    MandateRequest:
      type: object
      required: [tspId, maxAmount, period, validUntil]
      properties:
        tspId: {type: string}
        maxAmount: {type: integer, description: Лимит одного списания, копейки}
        period: {type: string, enum: [MONTHLY, WEEKLY, DAILY, CUSTOM]}
        maxDebitsPerPeriod: {type: integer, nullable: true}
        validUntil: {type: string, format: date-time}
        paymentPurpose: {type: string, nullable: true}
        merchantOrderId: {type: string, nullable: true}
    Mandate:
      type: object
      required: [mandateId, status, maxAmount, period]
      properties:
        mandateId: {type: string}
        status:
          type: string
          enum: [PENDING, ACTIVE, REVOKED, EXPIRED, DECLINED]
        maxAmount: {type: integer}
        period: {type: string, enum: [MONTHLY, WEEKLY, DAILY, CUSTOM]}
        confirmUrl: {type: string, nullable: true}
        activatedAt: {type: string, format: date-time, nullable: true}
        validUntil: {type: string, format: date-time, nullable: true}
        revokedAt: {type: string, format: date-time, nullable: true}
        subscriptions:
          type: array
          items: {type: string}
    SubscriptionRequest:
      type: object
      required: [tspId, mandateId, amount, period, firstDebitAt]
      properties:
        tspId: {type: string}
        mandateId: {type: string}
        amount: {type: integer, description: Сумма списания за период, копейки}
        period: {type: string, enum: [MONTHLY, WEEKLY, DAILY, CUSTOM]}
        firstDebitAt: {type: string, format: date-time}
        paymentPurpose: {type: string, nullable: true}
        merchantOrderId: {type: string, nullable: true}
    Subscription:
      type: object
      required: [subscriptionId, status, mandateId, amount, period]
      properties:
        subscriptionId: {type: string}
        status:
          type: string
          enum: [ACTIVE, PAUSED, SUSPENDED, CANCELLED]
        mandateId: {type: string}
        amount: {type: integer}
        period: {type: string, enum: [MONTHLY, WEEKLY, DAILY, CUSTOM]}
        nextDebitAt: {type: string, format: date-time, nullable: true}
    Debit:
      type: object
      required: [paymentId, subscriptionId, amount, status]
      properties:
        paymentId: {type: string}
        subscriptionId: {type: string}
        mandateId: {type: string, nullable: true}
        billingPeriod: {type: string, nullable: true}
        amount: {type: integer}
        status: {type: string, description: Статус платежа (см. Payment.status); отказ — FAILED}
        errorCode: {type: string, nullable: true}
    Problem:
      type: object
      required: [title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string, nullable: true}
        code: {type: string, nullable: true}
        traceId: {type: string, nullable: true}
        idempotencyKey: {type: string, nullable: true}
