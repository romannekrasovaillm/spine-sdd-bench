openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >-
    Мерчант-API СБП-шлюза. Версия 0.2.0 — аддитивное расширение 0.1.0: новые пути
    /v1/mandates*, опциональные поля mandateId/initiation в существующих схемах,
    новый enum MandateStatus. Ломающих изменений нет (см. docs/changes/sbp-subscriptions/CONTRACT-DIFF.md).
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      summary: Регистрация согласия плательщика на рекуррентные списания
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Согласие зарегистрировано, ожидает подтверждения плательщика
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус согласия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
  /v1/mandates/{mandateId}/revoke:
    post:
      operationId: revokeMandate
      summary: Отзыв согласия по инициативе ТСП
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Согласие отозвано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount:
          type: integer
          description: Сумма в копейках
        merchantOrderId:
          type: string
        mandateId:
          type: string
          description: Идентификатор согласия; обязателен при initiation=RECURRENT
        initiation:
          type: string
          description: Тип инициации платежа; по умолчанию ONE_OFF
          enum: [ONE_OFF, RECURRENT]
          default: ONE_OFF
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId:
          type: string
        amount:
          type: integer
          description: Сумма в копейках
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        mandateId:
          type: string
        initiation:
          type: string
          enum: [ONE_OFF, RECURRENT]
          default: ONE_OFF
    MandateRequest:
      type: object
      required: [tspId, currency]
      properties:
        tspId:
          type: string
        currency:
          type: string
          description: 'ISO 4217, напр. RUB'
        maxAmountPerCharge:
          type: integer
          description: 'Лимит на одно списание, копейки'
        maxAmountPerPeriod:
          type: integer
          description: 'Лимит за период, копейки'
        period:
          type: string
          description: 'Период лимита; справочник — по протоколу НСПК [ТРЕБУЕТ ПРОВЕРКИ]'
        validUntil:
          type: string
          format: date-time
        redirectUrl:
          type: string
          format: uri
        merchantMandateId:
          type: string
        payerReference:
          type: string
          description: 'Непрозрачная ссылка на плательщика; ПДн минимизируются'
    Mandate:
      type: object
      required: [mandateId, status, currency]
      properties:
        mandateId:
          type: string
        status:
          $ref: '#/components/schemas/MandateStatus'
        currency:
          type: string
        maxAmountPerCharge:
          type: integer
        maxAmountPerPeriod:
          type: integer
        period:
          type: string
        validUntil:
          type: string
          format: date-time
        qrId:
          type: string
        qrUrl:
          type: string
          format: uri
        qrImage:
          type: string
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        merchantMandateId:
          type: string
    MandateStatus:
      type: string
      enum: [CREATED, PENDING_PAYER, ACTIVE, SUSPENDED, REVOKED, EXPIRED, FAILED]
