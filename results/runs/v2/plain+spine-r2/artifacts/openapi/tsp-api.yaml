openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >
    Мерчант-API (ТСП ↔ СБП-шлюз). v0.2 — аддитивное расширение подписками
    (мандаты и рекуррентные списания). Совместимо с v0.1: пути /v1/payments* и
    enum Payment.status не изменены, новые поля опциональны (AD-010, ADR-010).
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа (для рекуррентного списания — того же ресурса по mandateId)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      summary: Создать согласие плательщика (мандат), получить ссылку на подтверждение
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Мандат создан, ожидается подтверждение плательщика
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '409':
          description: Конфликт идемпотентности
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: Превышен лимит запросов
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Состояние мандата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
  /v1/mandates/{mandateId}/revoke:
    post:
      operationId: revokeMandate
      summary: Отозвать согласие (отзыв ТСП; отзыв плательщиком приходит событием от ОПКЦ)
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses:
        '200':
          description: Мандат в REVOKED (повторный отзыв идемпотентен)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '422':
          description: Мандат не может быть отозван из текущего состояния
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/suspend:
    post:
      operationId: suspendMandate
      summary: Приостановить списания по согласию (согласие не отзывается)
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses:
        '200':
          description: Мандат в SUSPENDED (идемпотентно); новые списания запрещены
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '422':
          description: Мандат нельзя приостановить из текущего состояния
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/resume:
    post:
      operationId: resumeMandate
      summary: Возобновить списания по приостановленному согласию
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses:
        '200':
          description: Мандат снова ACTIVE (идемпотентно)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '422':
          description: Мандат отозван/истёк — возобновление невозможно
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/debits:
    post:
      operationId: createDebit
      summary: Инициировать рекуррентное списание по активному мандату
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DebitRequest'}
      responses:
        '201':
          description: Списание принято и поставлено в очередь; статус — GET /v1/payments/{paymentId}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '409':
          description: Списание за этот billingPeriod уже зарезервировано/существует
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Списание запрещено (мандат не ACTIVE, вне срока или сверх лимита)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: Сработал допуск при перегрузке (backpressure)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    get:
      operationId: listDebits
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Списания по мандату
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Payment'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        paymentType:
          type: string
          enum: [single, recurring]
          description: Вид платежа; отсутствие поля у старых клиентов трактуется как single
        mandateId:
          type: string
          description: Мандат, по которому проведено списание (только recurring)
        billingPeriod:
          type: string
          description: 'Период списания, например 2026-10 (только recurring)'
    MandateRequest:
      type: object
      required: [tspId, maxAmountPerDebit, limit, frequency, purpose]
      properties:
        tspId: {type: string}
        merchantSubscriptionId: {type: string}
        payerPhone: {type: string, description: 'Телефон плательщика (опц.; маскируется в хранении) — идентификация согласия'}
        maxAmountPerDebit: {type: integer, description: Максимум за одно списание, копейки}
        limit:
          type: object
          required: [amount, period]
          properties:
            amount: {type: integer, description: Лимит за период, копейки}
            period: {type: string, enum: [DAY, MONTH, TOTAL]}
        frequency: {type: string, enum: [DAILY, WEEKLY, MONTHLY, ON_DEMAND]}
        validFrom: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
        purpose: {type: string}
        redirectUrl: {type: string}
    Mandate:
      type: object
      required: [mandateId, tspId, status]
      properties:
        mandateId: {type: string}
        mandateRef: {type: string, description: Идентификатор мандата в ОПКЦ}
        payerRef: {type: string, description: 'Маскированная ссылка на плательщика; заполняется при активации согласия (AD-007)'}
        tspId: {type: string}
        merchantSubscriptionId: {type: string}
        status:
          type: string
          enum: [CREATED, PENDING_CONSENT, ACTIVE, SUSPENDED, REJECTED, REVOKED, EXPIRED]
        consentUrl: {type: string, description: Ссылка/QR для подтверждения согласия плательщиком}
        maxAmountPerDebit: {type: integer}
        limit:
          type: object
          properties:
            amount: {type: integer}
            period: {type: string, enum: [DAY, MONTH, TOTAL]}
        validFrom: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
        activatedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        revocationSource: {type: string, enum: [PAYER, MERCHANT, TSP_REQUEST]}
    DebitRequest:
      type: object
      required: [amount, billingPeriod]
      properties:
        amount: {type: integer, description: Сумма списания в копейках (<= maxAmountPerDebit)}
        billingPeriod:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2})?$'
          description: 'Канонический период: MONTHLY — YYYY-MM, DAILY — YYYY-MM-DD; ключ резервации периода (уникальность списания)'
        description: {type: string}
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 (application/problem+json)
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        traceId: {type: string}
        idempotencyKey: {type: string}
