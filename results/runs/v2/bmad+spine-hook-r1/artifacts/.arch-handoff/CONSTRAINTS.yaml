# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- change sbp-subscriptions (ADR-008): подписки СБП / рекуррентные C2B-списания ---
  - name: subscriptions-adr-present
    type: file_exists
    path: docs/adr/ADR-008-podpiski-sbp-soglasie-na-rekurrentnye-c2b-spisaniya.md
    severity: error
    owner: solution-architect
    rationale: 'рекуррентные списания — Critical; решение фиксируется ADR до реализации'
  - name: subscriptions-mandate-spec-present
    type: file_exists
    path: docs/spec/mandate-state-machine.md
    severity: error
    owner: solution-architect
    rationale: 'жизненный цикл согласия — источник истины для рекуррентных списаний'
  - name: mandate-consent-invariant
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'только против мандата в состоянии'
    severity: error
    owner: solution-architect
    rationale: 'AD-009: списание только по действующему согласию'
  - name: subscriptions-nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Окно остановки списаний после отзыва'
    severity: error
    owner: solution-architect
    rationale: 'NFR подписок должны быть измеримы (ADR-008)'
