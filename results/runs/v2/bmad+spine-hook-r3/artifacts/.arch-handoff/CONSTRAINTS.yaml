# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- изменение recurring-c2b-mandates (ADR-008, AD-009) ---
  - name: mandate-fsm-present
    type: file_exists
    path: docs/spec/recurring-mandates.md
    severity: error
  - name: adr-008-present
    type: file_exists
    path: docs/adr/ADR-008-rekurrentnye-c2b-spisaniya-po-soglasiyu-platelschika-podpiski-sbp-mandat-kak-otdelnyy-istochnik-istiny.md
    severity: error
  - name: debit-only-active-mandate
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'в состоянии `ACTIVE`'
    severity: error
    rationale: "AD-009: рекуррентное списание допустимо только по действующему мандату"
  - name: mandate-period-idempotency
    type: must_contain
    glob: "docs/spec/recurring-mandates.md"
    pattern: 'mandateId, periodKey'
    severity: error
    rationale: "AD-009/AD-003: идемпотентность списания по периоду мандата"
  - name: recurring-rollback-documented
    type: must_contain
    glob: "docs/solutioning-recurring-c2b.md"
    pattern: 'stop-new'
    severity: error
    rationale: "план отката рекуррентного контура обязателен"
  - name: nfr-recurring-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'Рекуррентные списания'
    severity: warn
    rationale: "измеримые NFR нового функционала"
  - name: ears-acceptance-criteria
    type: must_contain
    glob: "docs/spec/*.md"
    pattern: '(?m)^\s*[-*]?\s*\**\s*(When|While|If|Where)\b'
    severity: warn
    rationale: "критерии приёмки должны быть в EARS-форме (проверяемость)"
