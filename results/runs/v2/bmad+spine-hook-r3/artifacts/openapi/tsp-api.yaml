openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >
    Контракт API ТСП v0.2 — аддитивное расширение v0.1 (рекуррентные C2B-списания
    по согласию плательщика). Существующие потребители v0.1 не затронуты: все
    изменения — новые пути и опциональные поля. Ломающие изменения — только в /v2.
paths:
  /v1/payments:
    post:
      operationId: createPayment
      summary: Создание платежа (динамический QR/ссылка) или списания по мандату
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '409':
          description: Конфликт идемпотентности (тот же ключ, другое тело)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Списание выходит за границы мандата / мандат не активен
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      summary: Регистрация согласия плательщика (подписка СБП)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Мандат зарегистрирован, ожидается подтверждение плательщика
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '409':
          description: Конфликт идемпотентности
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Состояние мандата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '404':
          description: Мандат не найден
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/revoke:
    post:
      operationId: revokeMandate
      summary: Отзыв мандата со стороны ТСП (плательщик может отозвать в своём банке)
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Мандат отозван
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '409':
          description: Конфликт идемпотентности
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
        mandateId:
          type: string
          description: >
            Опционально. Если задан — создаётся рекуррентное списание по мандату
            (QR не выпускается); сумма и период проверяются против границ согласия.
            Взаимоисключимо с qrType.
        periodKey:
          type: string
          description: >
            Опционально, только для списания по мандату. Идентификатор периода
            (например, 2026-10); в границах периода допускается одно списание.
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        paymentType:
          type: string
          enum: [single, mandate_debit]
          description: Опционально; тип платежа. По умолчанию single.
        mandateId:
          type: string
          description: Опционально; мандат, по которому выполнено списание.
    MandateRequest:
      type: object
      required: [merchantOrderId]
      properties:
        merchantOrderId: {type: string, description: Сквозной идентификатор ТСП}
        amountLimit: {type: integer, description: Максимальная сумма одного списания, копейки}
        period:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY, ON_DEMAND]
          description: Периодичность списаний
        paymentPurpose: {type: string}
        validUntil: {type: string, format: date-time, description: Опционально; срок действия согласия}
    Mandate:
      type: object
      required: [mandateId, status]
      properties:
        mandateId: {type: string}
        status:
          type: string
          enum: [CREATED, PENDING_CONSENT, ACTIVE, SUSPENDED, REJECTED, EXPIRED, REVOKED]
        consentUrl: {type: string, description: Ссылка/QR подтверждения согласия (при PENDING_CONSENT)}
        amountLimit: {type: integer}
        period:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY, ON_DEMAND]
        nextDebitAt: {type: string, format: date-time, description: Плановая дата следующего списания (при ACTIVE)}
        merchantOrderId: {type: string}
        createdAt: {type: string, format: date-time}
        activatedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        errorCode: {type: string, description: Код отклонения ОПКЦ, если status REJECTED}
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        traceId: {type: string}
