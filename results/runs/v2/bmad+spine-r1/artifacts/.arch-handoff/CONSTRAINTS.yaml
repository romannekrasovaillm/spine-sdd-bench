# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # CHG-001: рекуррентные C2B-списания (подписки СБП). Инварианты AD-009..AD-012, ADR-008.
  - name: recurrence-mandate-basis
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'мандат'
    severity: error
  - name: recurrence-idempotent-charge
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'billingPeriod'
    severity: error
  - name: recurrence-revocation-blocks
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-011'
    severity: error
  - name: recurrence-contract-subscriptions
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/subscriptions'
    severity: error
  - name: recurrence-nfr-measurable
    type: must_contain
    glob: "changes/CHG-001-recurrent-c2b/NFR-DELTA.md"
    pattern: '99,95'
    severity: warn
