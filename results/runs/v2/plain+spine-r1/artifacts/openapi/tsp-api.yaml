openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >-
    Контракт API ТСП. Версия 0.2.0 — аддитивное расширение подписками СБП
    (согласие плательщика, подписка, рекуррентное списание); полностью
    совместима с 0.1.0 (снимок — openapi/tsp-api.v0.1.yaml): существующие пути,
    поля и значения enum не изменены. Машиночитаемая схема покрывает пути и
    модели данных; модель ошибок (problem+json, RFC 9457), аутентификация
    (mTLS/X-API-Key) и часть методов (онбординг ТСП, возвраты) нормативно
    описаны в docs/contracts/tsp-api.md.
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
    get:
      operationId: listPayments
      parameters:
        - {in: query, name: subscriptionId, required: false, schema: {type: string}}
      responses:
        '200':
          description: Список платежей (по подписке, если задан subscriptionId)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Согласие плательщика зарегистрировано (ожидает подтверждения плательщика)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус согласия плательщика
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
    delete:
      operationId: revokeMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Согласие переведено в REVOKING (отзыв, инициированный ТСП)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
  /v1/subscriptions:
    post:
      operationId: createSubscription
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionRequest'}
      responses:
        '201':
          description: Подписка создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
  /v1/subscriptions/{subscriptionId}:
    get:
      operationId: getSubscription
      parameters:
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус подписки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
  /v1/subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelSubscription
      parameters:
        - {in: path, name: subscriptionId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Подписка отменена (согласие плательщика не отзывается)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        subscriptionId: {type: string, description: "Подписка, по которой создан платёж (опционально; отсутствует у разовых платежей)"}
        billingPeriod:
          type: string
          pattern: '^\d{4}-\d{2}(-\d{2})?$'
          description: "Период списания (МСК): YYYY-MM для MONTHLY, YYYY-MM-DD начала периода для прочих; нормализуется шлюзом"
    MandateRequest:
      type: object
      required: [tspId]
      properties:
        tspId: {type: string}
        maxAmount: {type: integer, description: "Максимальная сумма одного списания, копейки"}
        period: {type: string, description: "Периодичность списания, напр. MONTHLY"}
        validUntil: {type: string, format: date-time, description: "Срок действия согласия"}
        merchantOrderId: {type: string}
    Mandate:
      type: object
      required: [mandateId, status]
      properties:
        mandateId: {type: string}
        status:
          type: string
          enum: [CREATED, PENDING_PAYER, ACTIVE, REVOKING, REVOKED, EXPIRED, REJECTED, FAILED]
        maxAmount: {type: integer}
        period: {type: string}
        validUntil: {type: string, format: date-time}
        confirmUrl: {type: string, description: "Ссылка/QR для подтверждения согласия плательщиком"}
    SubscriptionRequest:
      type: object
      required: [tspId, mandateId, amount]
      properties:
        tspId: {type: string}
        mandateId: {type: string}
        amount: {type: integer, description: "Сумма списания за период, копейки"}
        period: {type: string, description: "Периодичность, напр. MONTHLY"}
        paymentPurpose: {type: string}
        merchantOrderId: {type: string}
    Subscription:
      type: object
      required: [subscriptionId, status]
      properties:
        subscriptionId: {type: string}
        status:
          type: string
          enum: [DRAFT, PENDING_MANDATE, ACTIVE, SUSPENDED, CANCELLED]
        mandateId: {type: string}
        amount: {type: integer}
        period: {type: string}
        nextBillingAt: {type: string, format: date-time}
