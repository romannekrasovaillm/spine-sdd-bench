# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- Подписки СБП (ADR-008, AD-009..AD-013). Текстовый слой трассировки;
  # поведенческие проверки (command_succeeds) добавляются при handoff в реализацию.
  - name: sub-spec-exists
    type: file_exists
    path: docs/spec/subscriptions.md
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-adr-exists
    type: file_exists
    path: docs/adr/ADR-008-podpiski-sbp-rekurrentnye-c2b-spisaniya-po-soglasiyu-platelschika.md
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-only-with-active-mandate
    type: must_contain
    glob: "docs/spec/subscriptions.md"
    pattern: 'статусе согласия, отличном от `ACTIVE`'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-idempotent-billing-key
    type: must_contain
    glob: "docs/spec/subscriptions.md"
    pattern: 'billingPeriod, attempt'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-mandate-ownership
    type: must_contain
    glob: "docs/spec/subscriptions.md"
    pattern: 'принадлежит тому же ТСП'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-no-qr-branch
    type: must_contain
    glob: "docs/spec/subscriptions.md"
    pattern: 'T4a'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-revocation-priority
    type: must_contain
    glob: "docs/spec/subscriptions.md"
    pattern: 'подтверждённого'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-recurring-credit-from-paid
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'только из `PAID`'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-additive-contract
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'аддитивно'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-entities-separated
    type: must_contain
    glob: "docs/spec/subscriptions.md"
    pattern: 'AD-013'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: sub-api-version-bumped
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '0.2.0'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
  - name: spec-required-sections
    type: each_file_must_contain
    glob: "docs/spec/*.md"
    pattern: '## Критерии приёмки'
    severity: error
    owner: solution-architect
    expiry: 2027-03-31
