# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- Изменение sbp-recurring-c2b: рекуррентные C2B-списания по мандату ---
  - name: recurring-spine-invariant
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'AD-009'
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: recurring-mandate-state-machine
    type: file_exists
    path: docs/spec/subscription-lifecycle.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: recurring-delta-declared
    type: file_exists
    path: changes/sbp-recurring-c2b/DELTA.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: recurring-api-additive
    type: must_contain
    glob: "openapi/tsp-api.yaml"
    pattern: '/v1/mandates'
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: recurring-nfr-no-unauthorized
    type: must_contain
    glob: "docs/nfr-recurring-c2b.md"
    pattern: 'Несанкционированные списания'
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: recurring-adr-008
    type: file_exists
    path: docs/adr/ADR-008-rekurrentnye-c2b-spisaniya-mandat-platelschika-i-planirovschik-spisaniy.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
  - name: recurring-adr-009
    type: file_exists
    path: docs/adr/ADR-009-soglasie-platelschika-mandat-poluchenie-hranenie-otzyv-i-zapret-spisaniy.md
    severity: error
    owner: solution-architect (платёжный контур)
    expiry: 2027-03-31
