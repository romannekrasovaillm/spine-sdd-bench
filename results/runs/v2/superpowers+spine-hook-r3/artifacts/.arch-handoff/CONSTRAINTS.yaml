# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение (до кода). После выбора стека и начала реализации handoff перегенерирует
# констрейнты под кодовый харнесс (сборка, линтеры, тесты).
rules:
  - name: adr-set-complete
    type: file_exists
    path: docs/adr/ADR-001-outbox.md
    severity: error
  - name: spine-present
    type: file_exists
    path: ARCHITECTURE-SPINE.md
    severity: error
  - name: nfr-measurable
    type: must_contain
    glob: "docs/nfr.md"
    pattern: '99,95'
    severity: error
  - name: abs-credit-only-from-paid
    type: must_contain
    glob: "docs/adr/ADR-005-integraciya-s-abs-zachislenie-po-podtverzhdyonnomu-statusu-vozvraty-kak-saga.md"
    pattern: 'только из состояния `PAID`'
    severity: error
  - name: adr-no-placeholders
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
  - name: readme-exists
    type: file_exists
    path: README.md
    severity: warn
  - name: spine-lints-clean
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|XXX'
    severity: warn
  # --- Подписки СБП (changes/spb-subscriptions, ADR-008/ADR-009) ---
  - name: adr-subscriptions-present
    id: C-008
    type: file_exists
    path: docs/adr/ADR-008-podpiski-sbp-soglasiye-i-spisaniya.md
    severity: error
    ad: AD-009
    owner: solution-architect (платёжный контур)
    expiry: "2027-09-28"
    rationale: "Решение о подписках фиксируется до реализации; пропажа ADR — потеря аудиторского следа."
    fix_hint: "Восстановить ADR-008 или оформить заменяющее решение (Supersedes)."
    skill: adr-authoring
  - name: subscription-consent-invariant
    id: C-009
    type: must_contain
    glob: "docs/spec/subscription-consent.md"
    pattern: 'только из состояния `ACTIVE`'
    severity: error
    ad: AD-009
    owner: solution-architect (платёжный контур)
    expiry: "2027-09-28"
    rationale: "Списание по подписке допустимо только при действующем согласии; пропажа формулировки — потеря инварианта из спецификации."
    fix_hint: "Вернуть в спецификацию правило «списание только из состояния ACTIVE» (AD-009)."
    skill: fitness-functions
