openapi: 3.0.3
info:
  title: СБП-шлюз — API ТСП
  version: 0.2.0
  description: >
    Контракт API ТСП. Изменение add-sbp-subscriptions: добавлены операции
    /v1/mandates* и опциональные поля платежа (mandateId, billingPeriodKey).
    Изменения обратно совместимы в пределах /v1; ломающие изменения — только в /v2.
paths:
  /v1/payments:
    post:
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Платёж зарегистрирован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - {in: path, name: paymentId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
  /v1/mandates:
    post:
      operationId: createMandate
      description: Регистрация мандата (согласия плательщика) на рекуррентные списания.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateRequest'}
      responses:
        '201':
          description: Мандат зарегистрирован, ожидается согласие плательщика
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '403':
          description: ТСП неактивен
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}:
    get:
      operationId: getMandate
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Статус мандата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '404':
          description: Мандат не найден
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/cancel:
    post:
      operationId: cancelMandate
      description: Отзыв или приостановка мандата по инициативе ТСП.
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MandateCancelRequest'}
      responses:
        '200':
          description: Мандат отозван или приостановлен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '409':
          description: Мандат не в состоянии, допускающем отзыв
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/mandates/{mandateId}/charges:
    get:
      operationId: listMandateCharges
      description: Список списаний по мандату (списания представлены платежами).
      parameters:
        - {in: path, name: mandateId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Список списаний
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Payment'}
        '404':
          description: Мандат не найден
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, merchantOrderId]
      properties:
        amount: {type: integer, description: Сумма в копейках}
        merchantOrderId: {type: string}
    Payment:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId: {type: string}
        amount: {type: integer, description: Сумма в копейках}
        status:
          type: string
          enum: [CREATED, QR_ISSUED, PAID, CREDITED, COMPLETED, FAILED, EXPIRED, REFUNDED]
        mandateId:
          type: string
          description: Идентификатор мандата, если платёж является списанием подписки (опционально)
        billingPeriodKey:
          type: string
          description: Ключ периода списания, если платёж является списанием подписки (опционально)
    MandateRequest:
      type: object
      required: [tspId, amountLimit, currency, periodicity]
      properties:
        tspId: {type: string}
        amountLimit: {type: integer, description: Максимальная сумма списания за период, в копейках}
        currency: {type: string, description: Валюта ISO 4217, для СБП — RUB}
        periodicity:
          type: string
          enum: [WEEKLY, MONTHLY, CUSTOM]
          description: Периодичность списаний
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        paymentPurpose: {type: string}
        merchantOrderId: {type: string}
    MandateCancelRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [REVOKE, SUSPEND]
          description: REVOKE — окончательный отзыв; SUSPEND — временная приостановка
        reason: {type: string}
    Mandate:
      type: object
      required: [mandateId, status, amountLimit, currency, periodicity]
      properties:
        mandateId: {type: string}
        status:
          type: string
          enum: [PENDING_CONSENT, ACTIVE, SUSPENDED, REVOKED, EXPIRED]
        amountLimit: {type: integer, description: Максимальная сумма списания за период, в копейках}
        currency: {type: string}
        periodicity:
          type: string
          enum: [WEEKLY, MONTHLY, CUSTOM]
        consentRef: {type: string, description: Идентификатор согласия в ОПКЦ}
        consentUrl: {type: string, description: Ссылка для получения согласия плательщика (если применимо)}
        createdAt: {type: string, format: date-time}
        activatedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        revokeReason: {type: string}
        merchantOrderId: {type: string}
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 (Problem Details)
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: Канонический код ошибки, включая MANDATE_NOT_FOUND, MANDATE_NOT_ACTIVE, MANDATE_CONSENT_PENDING, MANDATE_LIMIT_EXCEEDED
        traceId: {type: string}
        idempotencyKey: {type: string}
