# Рубрика качества handoff-пакета CHANGE-001 «СБП-подписки».
# Формат — как у .arch-handoff/RUBRIC.yaml: пакет должен позволить реализацию без доступа к исходным документам.
name: handoff_quality_change_001
description: "Качество пакета передачи исполнителям по CHANGE-001 (СБП-подписки): epic-context, инварианты, критерии приёмки, контракт результата, план отката"
scale_max: 5
origin: anchor
criteria:
  - id: epic_context
    name: Полнота epic-context
    description: "Дистиллят 800–1500 токенов: цель, стыки, запреты; без дословных цитат документа и воды"
    weight: 3
    anchors:
      1: "Контекст — свалка выдержек или приписка «сделай по ADR-008»; реализация потребует догадок"
      3: "Смысловое ядро есть, но перечень стыков (операции/события адаптера, новые методы API) покрыт частично"
      5: "800–1500 токенов чистого смысла: цель, внутренний контракт транспорта, новые методы API, запреты; агент реализует без доступа к источникам"
  - id: invariants
    name: Инварианты и запреты
    description: "Связывающие AD переданы дословно (Rule), явно перечислено, что менять запрещено"
    weight: 3
    anchors:
      1: "Инварианты не переданы; исполнитель волен переизобрести контракты"
      3: "Инварианты перечислены, но пересказаны (потеряна точность Rule)"
      5: "AD-002/003/004/005/009/010 присутствуют с дословными Rule; явный список запрещённых изменений; конфликт с spine обязан останавливать работу"
  - id: acceptance_criteria
    name: Критерии приёмки
    description: "Проверяемые критерии, включая негативные сценарии (дубль, отказ соседа, гонка) и критерий отката"
    weight: 2
    anchors:
      1: "Критерии отсутствуют или непроверяемы"
      3: "Критерии измеримы, но только позитивные"
      5: "Каждый критерий проверяем тестом; негативные сценарии (дубль списания, отзыв в гонке, отказ АБС, недоставка уведомления) и явный rollback-критерий покрыты"
  - id: result_contract
    name: Контракт результата (headless JSON)
    description: "Требование завершить прогон JSON-статусом с assumptions/open_questions/conflicts_with_prior_decisions"
    weight: 2
    anchors:
      1: "Формат результата не задан"
      3: "JSON-статус требуется, но поля не объяснены"
      5: "Контракт полный: статус + три списка; conflicts обязан останавливать и эскалировать; при blocked перечислены недостающие входы"
  - id: rollback_plan
    name: План отката
    description: "Как откатывается изменение, сигналы-триггеры, владелец решения"
    weight: 2
    anchors:
      1: "Плана отката нет"
      3: "Откат упомянут одной фразой"
      5: "Пошаговый откат (фиче-флаг, завершение открытых операций, сохранение данных) с сигналами и владельцем; обратимость согласована с ADR-008"
  - id: contract_compat
    name: Совместимость контрактов
    description: "Аддитивность API и адаптера; обоснование отсутствия ломающих изменений"
    weight: 2
    anchors:
      1: "Контракт изменён без анализа совместимости"
      3: "Совместимость заявлена, но матрица/перечень изменений неполны"
      5: "Полная матрица: новые пути/схемы/опциональные поля; enum Payment.status неизменён; версия 0.2.0; обоснование по правилу §6"
